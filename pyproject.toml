[project]
name = "finalproject"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.9.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "llama-index-core>=0.12.0",
    "llama-index-workflows>=0.2.0",
    "mcp>=1.1.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.30.0",
]

[project.scripts]
finalproject = "finalproject:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
